# Ghostty Terminal Configuration
# Modern terminal emulator with excellent performance and features

# Font Configuration
font-family = "Fira Code"
font-size = 14
font-features = "liga=1, calt=1"

# Color Scheme (Dark Theme)
background = "#1e1e1e"
foreground = "#d4d4d4"

# Cursor
cursor-color = "#d4d4d4"
cursor-style = "block"
cursor-blink = true

# Selection
selection-background = "#264f78"
selection-foreground = "#d4d4d4"

# Colors (16-color palette)
color-0 = "#000000"   # Black
color-1 = "#cd3131"   # Red
color-2 = "#0dbc79"   # Green
color-3 = "#e5e510"   # Yellow
color-4 = "#2472c8"   # Blue
color-5 = "#bc3fbc"   # Magenta
color-6 = "#11a8cd"   # Cyan
color-7 = "#e5e5e5"   # White
color-8 = "#666666"   # Bright Black
color-9 = "#f14c4c"   # Bright Red
color-10 = "#23d18b"  # Bright Green
color-11 = "#f5f543"  # Bright Yellow
color-12 = "#3b8eea"  # Bright Blue
color-13 = "#d670d6"  # Bright Magenta
color-14 = "#29b8db"  # Bright Cyan
color-15 = "#e5e5e5"  # Bright White

# Window Configuration
window-padding-width = 8
window-padding-height = 8
window-border-width = 0
window-border-color = "#3c3c3c"

# Tab Bar
tab-bar-background = "#2d2d2d"
tab-bar-foreground = "#d4d4d4"
tab-bar-border-color = "#3c3c3c"
tab-bar-border-width = 1

# Tab Colors
tab-active-background = "#1e1e1e"
tab-active-foreground = "#d4d4d4"
tab-inactive-background = "#2d2d2d"
tab-inactive-foreground = "#808080"

# Bell
bell-color = "#f14c4c"
bell-duration = 200

# URL Detection
url-color = "#3b8eea"
url-style = "single"

# Mouse
mouse-hide-while-typing = true
mouse-url-launcher = "open"

# Scrollback
scrollback-lines = 10000
scrollback-multiplier = 3

# Performance
repaint-delay = 10
input-delay = 0

# Shell Integration
shell-integration = true

# Terminal Features
allow-hyperlinks = true
allow-images = true
allow-remote-control = true

# Window Management
window-title = "Ghostty"
window-title-template = "{title} - {cwd}"

# Keyboard Shortcuts (macOS)
# Note: These are handled by the application, not config file
# But we can document common shortcuts here:
# Cmd+T: New tab
# Cmd+W: Close tab
# Cmd+Shift+T: Reopen closed tab
# Cmd+1-9: Switch to tab
# Cmd+Plus/Minus: Zoom in/out
# Cmd+0: Reset zoom
# Cmd+K: Clear scrollback
# Cmd+Shift+K: Clear screen
# Cmd+C: Copy
# Cmd+V: Paste
# Cmd+Shift+C: Copy (alternative)
# Cmd+Shift+V: Paste (alternative)

# Advanced Features
# Enable ligatures for programming fonts
font-ligatures = true

# Enable smooth scrolling
smooth-scrolling = true

# Enable GPU acceleration (if available)
gpu-acceleration = true

# Enable transparency (if supported)
background-opacity = 0.95

# Enable blur effect (if supported)
background-blur = 10
