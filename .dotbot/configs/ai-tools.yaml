- shell:
  -
    command: |
      echo "Installing AI development tools..."
    description: Installing AI development tools

- shell:
  -
    command: |
      if ! command -v cursor-agent >/dev/null 2>&1; then
        echo "Installing cursor-agent..."
        curl https://cursor.com/install -fsS | bash
        # Ensure ~/.local/bin is in PATH
        if ! echo "$PATH" | grep -q "$HOME/.local/bin"; then
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.zshrc
          export PATH="$HOME/.local/bin:$PATH"
        fi
      else
        echo "cursor-agent is already installed"
      fi
    description: Install cursor-agent

- shell:
  -
    command: |
      if ! command -v claude >/dev/null 2>&1; then
        echo "Installing Claude Code..."
        if [[ "$OSTYPE" == "darwin"* ]] && command -v brew >/dev/null 2>&1; then
          brew install claude
        elif command -v npm >/dev/null 2>&1; then
          npm install -g @anthropic-ai/claude-code
        else
          echo "⚠️  Cannot install claude: need Homebrew (macOS) or npm (Linux)"
        fi
      else
        echo "Claude Code is already installed"
      fi
    description: Install Claude Code

- shell:
  -
    command: |
      # Symlink claude into ~/.local/bin on macOS (so it shadows any older version)
      if [[ "$OSTYPE" == "darwin"* ]]; then
        if [ -f "/opt/homebrew/bin/claude" ] && [ ! -L "$HOME/.local/bin/claude" ]; then
          mkdir -p "$HOME/.local/bin"
          ln -sf /opt/homebrew/bin/claude "$HOME/.local/bin/claude"
          echo "Claude symlinked into ~/.local/bin"
        fi
      fi
    description: Create Claude symlink in ~/.local/bin (macOS only)

- shell:
  -
    command: |
      # GitHub Copilot CLI via gh extension (works on both OSes if gh is installed)
      if command -v gh >/dev/null 2>&1; then
        if ! gh extension list 2>/dev/null | grep -q "github/gh-copilot"; then
          echo "Installing GitHub Copilot CLI..."
          gh extension install github/gh-copilot || true
        else
          echo "GitHub Copilot CLI already installed"
        fi
      else
        echo "⚠️  gh CLI not installed — skipping Copilot CLI"
      fi
    description: Install GitHub Copilot CLI

- shell:
  -
    command: |
      export PATH="$HOME/.local/bin:$PATH"
      if command -v cursor-agent >/dev/null 2>&1; then
        echo "cursor-agent version: $(cursor-agent --version)"
      fi
      if command -v claude >/dev/null 2>&1; then
        echo "Claude Code version: $(claude --version)"
      fi
    description: Verify AI tools installation
