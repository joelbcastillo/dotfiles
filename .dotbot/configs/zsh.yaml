- shell:
    - command: |
        ZSH_BIN="$(command -v zsh || true)"
        if [ -z "$ZSH_BIN" ]; then
          echo "⚠️  zsh not found in PATH — install zsh first (apt install zsh on Linux)"
          exit 1
        fi
        if ! grep -qxF "$ZSH_BIN" /etc/shells; then
          echo "$ZSH_BIN" | sudo tee -a /etc/shells
        fi
        if [ "$SHELL" != "$ZSH_BIN" ]; then
          echo "[INFO] You will now be prompted for your password to change your default shell."
          chsh -s "$ZSH_BIN"
        fi
      description: Add zsh to /etc/shells and set as default shell (portable)

- link:
    ~/.zshenv: shells/zsh/zshenv
    ~/.zprofile: shells/zsh/zprofile
    ~/.zshrc: shells/zsh/zshrc
    ~/.zlogin: shells/zsh/zlogin
    ~/.zlogout: shells/zsh/zlogout
    ~/.zsh.before: shells/zsh/zsh.before
    ~/.zsh.after: shells/zsh/zsh.after
