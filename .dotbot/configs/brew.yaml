- shell:
  -
    command: |
      if [[ "$OSTYPE" != "darwin"* ]]; then
        echo "⏭  Skipping Homebrew setup — not on macOS"
        exit 0
      fi
      if ! command -v brew >/dev/null 2>&1; then
        echo "Installing Homebrew..."
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

        if ! command -v brew >/dev/null 2>&1; then
          echo "❌ ERROR: Homebrew installation failed"
          echo "Please install Homebrew manually:"
          echo "  /bin/bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\""
          exit 1
        fi

        echo "✅ Homebrew installed successfully"
      else
        echo "✅ Homebrew already installed"
      fi
    description: Install and verify Homebrew (macOS only)

- shell:
  -
    command: |
      if [[ "$OSTYPE" != "darwin"* ]]; then
        exit 0
      fi
      # Detect Homebrew location (prioritize user-local)
      if [ -x "$HOME/.homebrew/bin/brew" ]; then
        BREW_PREFIX="$HOME/.homebrew"
      elif [ -x "/opt/homebrew/bin/brew" ]; then
        BREW_PREFIX="/opt/homebrew"
      elif [ -x "/usr/local/bin/brew" ]; then
        BREW_PREFIX="/usr/local"
      fi

      if [ -n "$BREW_PREFIX" ]; then
        eval "$($BREW_PREFIX/bin/brew shellenv)"
        echo "✅ Configured Homebrew from: $BREW_PREFIX"
      fi
    description: Configure Homebrew shell environment (macOS only)

- link:
    ~/Brewfile:
      path: tools/homebrew/Brewfile
      relink: true
      force: true

- shell:
  -
    command: |
      if [[ "$OSTYPE" != "darwin"* ]]; then
        echo "⏭  Skipping brew bundle — not on macOS"
        exit 0
      fi
      brew update
      brew upgrade
      brew cleanup
      ~/.dotfiles/scripts/brew-bundle-safe.sh ~/Brewfile
    description: Update Homebrew and install Brewfile (macOS only)
