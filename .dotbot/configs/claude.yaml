- shell:
  - 
    command: |
      echo "Setting up Claude CLI..."
    description: Setting up Claude CLI

- shell:
  - 
    command: |
      # Create Claude config directory if it doesn't exist
      mkdir -p ~/.claude
    description: Create Claude config directory

# Note: Claude CLI doesn't require a settings.local.json file
# The CLI works with default settings or environment variables

- shell:
  -
    command: |
      # Check if Claude CLI is installed
      if ! command -v claude >/dev/null 2>&1; then
        echo "Warning: Claude CLI not found. Please install it:"
        echo "  brew install claude"
        echo "  # or download from: https://claude.ai/download"
      else
        echo "Claude CLI found at: $(which claude)"
      fi
    description: Check Claude CLI installation

- shell:
  - 
    command: |
      echo "Claude setup completed"
    description: Complete Claude setup
