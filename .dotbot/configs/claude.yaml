- shell:
    - command: |
        echo "Setting up Claude Code..."
        mkdir -p ~/.claude/plugins/local
      description: Create Claude config directories

- link:
    ~/.claude/settings.json:
      path: apps/claude/settings.json
      relink: true
      force: true
    ~/.claude/scripts:
      path: apps/claude/scripts
      relink: true
      force: true
    ~/.claude/hooks:
      path: apps/claude/hooks
      relink: true
      force: true
    ~/.claude/plugins/local/outlook-mcp:
      path: apps/claude/plugins/local/outlook-mcp
      relink: true
      force: true

- shell:
    - command: |
        # Not a link: Claude Code writes installLocation/lastUpdated into this
        # file, so symlinking it into the repo dirtied the tree on every plugin
        # refresh. Seeds/merges from the tracked template instead, and migrates
        # the old symlink if one is still in place.
        bash "$HOME/.dotfiles/apps/claude/scripts/seed-known-marketplaces.sh"
      description: Seed known_marketplaces.json from the tracked template

- shell:
    - command: |
        if ! command -v claude >/dev/null 2>&1; then
          echo "Warning: Claude Code not found. Install with: npm install -g @anthropic-ai/claude-code"
          echo "  (or run: upgrade-claude-npm-tools)"
        else
          echo "Claude Code found at: $(command -v claude)"
        fi
      description: Check Claude Code installation

- shell:
    - command: |
        echo "Claude setup completed"
      description: Complete Claude setup
