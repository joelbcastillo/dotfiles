- vscodefile:
    file: apps/vscode/extensions
    insiders: false

- shell:
  -
    command: |
      if [[ "$OSTYPE" == "darwin"* ]]; then
        VSCODE_USER_DIR="$HOME/Library/Application Support/Code/User"
      else
        VSCODE_USER_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/Code/User"
      fi
      mkdir -p "$VSCODE_USER_DIR"
      ln -sfn "$HOME/.dotfiles/apps/vscode/settings.json" "$VSCODE_USER_DIR/settings.json"
    description: Link VS Code settings (OS-aware path)
