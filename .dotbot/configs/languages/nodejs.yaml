- shell:
    - command: |
        # asdf 0.16+ is a Go binary; PATH integration is enough.
        export PATH="/opt/homebrew/bin:$HOME/.asdf/shims:$PATH"
        asdf plugin add nodejs || true
        asdf plugin update nodejs || true
        asdf install nodejs 25.9.0
        asdf set -u nodejs 25.9.0
        asdf reshim nodejs

        # Install global npm packages
        npm install -g npm@latest
        npm install -g yarn
        npm install -g pnpm
        npm install -g typescript
        npm install -g ts-node
        npm install -g nodemon
        npm install -g eslint
        npm install -g prettier
        npm install -g @vue/cli
        npm install -g @angular/cli
      description: Set up Node.js with asdf and global tools

- link:
    ~/.nvmrc: tools/nodejs/nvmrc
    ~/.eslintrc: tools/nodejs/eslintrc
    ~/.prettierrc: tools/nodejs/prettierrc
    ~/.yarnrc: tools/nodejs/yarnrc
    ~/.pnpmrc: tools/nodejs/pnpmrc

- shell:
    - command: |
        if command -v op >/dev/null 2>&1; then
          if op inject -i ~/.dotfiles/tools/nodejs/npmrc -o ~/.npmrc 2>/dev/null; then
            chmod 600 ~/.npmrc
            echo "npmrc injected with 1Password secrets"
          else
            echo "Warning: 1Password injection failed (not signed in?), linking template"
            ln -sf ~/.dotfiles/tools/nodejs/npmrc ~/.npmrc
          fi
        else
          echo "Warning: 1Password CLI not available, linking npmrc template as-is"
          ln -sf ~/.dotfiles/tools/nodejs/npmrc ~/.npmrc
        fi
      description: Inject npm auth token from 1Password