- shell:
      - command: |
            echo "Setting up Python with asdf..."
            export PATH="/opt/homebrew/bin:$HOME/.asdf/shims:$PATH"
            asdf plugin add python || true
            asdf plugin update python || true
            asdf install python 3.13.8
            asdf set -p python 3.13.8
        description: Set up Python with asdf
      - command: |
            # pipx ships pinned to whichever python brew picked at install time.
            # On fresh boxes that's python@3.14, whose ensurepip is broken under
            # current Homebrew. Force pipx onto python@3.13 by recreating the
            # shared venv when it points at a non-functional interpreter.
            PIPX_PY313="/opt/homebrew/opt/python@3.13/bin/python3.13"
            if [ -x "$PIPX_PY313" ]; then
              SHARED_CFG="$HOME/.local/pipx/shared/pyvenv.cfg"
              if [ ! -f "$SHARED_CFG" ] || ! grep -q "python@3.13" "$SHARED_CFG"; then
                echo "Recreating pipx shared venv with python@3.13..."
                rm -rf "$HOME/.local/pipx/shared"
                "$PIPX_PY313" -m venv "$HOME/.local/pipx/shared"
                "$HOME/.local/pipx/shared/bin/python" -m pip install --upgrade pip pipx
              fi
            fi
        description: Pin pipx shared venv to python@3.13

- link:
      ~/.pip/pip.conf:
          path: tools/python/pip.conf
          relink: true
          force: true
      ~/.pythonrc:
          path: tools/python/pythonrc
          relink: true
          force: true
      ~/.config/pipx/config.json:
          path: tools/pipx/config.json
          relink: true
          force: true
      ~/.pylintrc:
          path: tools/python/pylintrc
          relink: true
          force: true
      ~/.flake8:
          path: tools/python/flake8
          relink: true
          force: true
      ~/.config/flake8:
          path: tools/python/flake8
          relink: true
          force: true
      ~/.mypy.ini:
          path: tools/python/mypy.ini
          relink: true
          force: true
      ~/.isort.cfg:
          path: tools/python/isort.cfg
          relink: true
          force: true
      ~/.config/isort.cfg:
          path: tools/python/isort
          relink: true
          force: true
      ~/.pre-commit-config.yaml:
          path: tools/python/pre-commit-config.yaml
          relink: true
          force: true
      ~/.poetry/config.toml:
          path: tools/python/poetry.toml
          relink: true
          force: true

- pipx:
      file: tools/pipx/requirements.txt
      stdout: false
      stderr: true

- shell:
      - command: |
            mkdir -p ~/.zfunc
            if [ -f ~/.local/bin/poetry ]; then
              ~/.local/bin/poetry completions zsh > ~/.zfunc/_poetry
              echo "Poetry Zsh completions installed"
            else
              echo "Poetry not found, skipping completions"
            fi
        description: Add Poetry Zsh completions
      - command: |
            if [ -f ~/.local/bin/poetry ]; then
              ~/.local/bin/poetry config virtualenvs.in-project true
              echo "Poetry configured to use in-project virtualenvs"
            else
              echo "Poetry not found, skipping configuration"
            fi
        description: Configure Poetry to use in-project virtualenvs
