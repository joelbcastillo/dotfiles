- shell:
    - command: |
        export PATH="/opt/homebrew/bin:$HOME/.asdf/shims:$PATH"
        asdf plugin add golang || true
        asdf plugin update golang || true
        asdf install golang 1.22.0
        asdf set -u golang 1.22.0
        
        # Set up Go environment
        go install golang.org/x/tools/cmd/godoc@latest
        go install github.com/go-delve/delve/cmd/dlv@latest
        go install github.com/cosmtrek/air@latest
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        go install github.com/ramya-rao-a/go-outline@latest
        go install github.com/nsf/gocode@latest
        go install github.com/rogpeppe/godef@latest
        go install github.com/sqs/goreturns@latest
        go install github.com/golang/protobuf/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
        go install github.com/mitchellh/gox@latest
        go install github.com/goreleaser/goreleaser@latest
      description: Set up Go with asdf and development tools

- link:
    ~/.go/config: tools/go/config
    ~/.golangci.yml: tools/go/golangci.yml
    ~/.goreleaser.yml: tools/go/goreleaser.yml 