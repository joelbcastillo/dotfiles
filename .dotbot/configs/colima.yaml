- shell:
  -
    command: |
      if [[ "$OSTYPE" != "darwin"* ]]; then
        echo "⏭  Skipping Colima — macOS-only (Linux uses native Docker)"
        exit 0
      fi
      if ! command -v colima >/dev/null 2>&1; then
        echo "❌ ERROR: Colima is not installed"
        echo "Please run 'brew bundle' first to install Colima"
        exit 1
      fi
      echo "✅ Colima is installed"
    description: Verify Colima is installed (macOS only)

- shell:
  -
    command: |
      if [[ "$OSTYPE" != "darwin"* ]]; then
        exit 0
      fi
      if [ -x ~/.dotfiles/tools/colima/setup.sh ]; then
        ~/.dotfiles/tools/colima/setup.sh
      else
        echo "❌ ERROR: Setup script not found or not executable"
        exit 1
      fi
    description: Run Colima setup script (macOS only)

- shell:
  -
    command: |
      if [[ "$OSTYPE" != "darwin"* ]]; then
        exit 0
      fi
      if colima status >/dev/null 2>&1; then
        echo "✅ Colima is running"
        if docker version >/dev/null 2>&1; then
          echo "✅ Docker CLI is working with Colima"
        else
          echo "⚠️  WARNING: Docker CLI not working properly"
        fi
      else
        echo "⚠️  WARNING: Colima is not running"
        echo "Run 'colima start' to start Colima"
      fi
    description: Verify Colima setup (macOS only)
