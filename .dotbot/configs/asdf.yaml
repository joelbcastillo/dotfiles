- shell:
    - command: |
        # Install asdf via git clone if not already installed and brew isn't in play
        if ! command -v asdf >/dev/null 2>&1 && [ ! -f "$HOME/.asdf/asdf.sh" ]; then
          if command -v brew >/dev/null 2>&1 && [ -f "$(brew --prefix)/opt/asdf/libexec/asdf.sh" ]; then
            echo "✅ asdf available via Homebrew"
          else
            echo "Installing asdf via git clone to ~/.asdf..."
            git clone https://github.com/asdf-vm/asdf.git "$HOME/.asdf" --branch v0.14.1
          fi
        fi

        # Load asdf via portable helper to validate
        if . "$HOME/.dotfiles/tools/asdf/load-asdf.sh"; then
          echo "✅ asdf loaded successfully"
        else
          echo "⚠️  asdf not available; language configs will no-op"
          exit 0
        fi
      description: Install (if needed) and validate asdf

- link:
    ~/.asdfrc: tools/asdf/asdfrc
    ~/.tool-versions: tools/asdf/tool-versions
