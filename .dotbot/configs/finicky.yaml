- shell:
    - command: |
        if [[ "$OSTYPE" != "darwin"* ]]; then
          echo "⏭  Skipping Finicky — macOS-only"
          exit 0
        fi
        echo "Setting up Finicky configuration..."
        if [ -f "$HOME/.dotfiles/tools/finicky/finicky.js" ]; then
          ln -sfn "$HOME/.dotfiles/tools/finicky/finicky.js" "$HOME/.finicky.js"
        else
          echo "⚠️  tools/finicky/finicky.js not present — finicky config not linked"
        fi
      description: Link Finicky config (macOS only)

- shell:
    - command: |
        if [[ "$OSTYPE" != "darwin"* ]]; then
          exit 0
        fi
        echo "Finicky configuration setup completed"
        echo "⚠️  Remember to:"
        echo "   1. Update the Edge profile directory in ~/.dotfiles-private/tools/finicky/finicky.js"
        echo "   2. Find your profile by opening Edge and going to edge://version/"
        echo "   3. Run './install config finicky' again after updating the private config"
        echo "   4. Restart Finicky or your Mac for changes to take effect"
      description: Complete Finicky setup with reminders (macOS only)
