- shell:
    - command: |
        echo "Setting up 1Password CLI configuration..."
      description: Setting up 1Password CLI configuration

- shell:
    - command: |
        # Create 1Password config directory if it doesn't exist
        mkdir -p ~/.config/op
      description: Create 1Password config directory

- shell:
    - command: |
        # Copy 1Password config file instead of symlinking (1Password CLI doesn't allow symlinks)
        cp tools/1password/config ~/.config/op/config
        # Set correct permissions (600) for 1Password CLI security requirements
        chmod 600 ~/.config/op/config
      description: Copy 1Password CLI configuration with correct permissions

- shell:
    - command: |
        echo "1Password CLI configuration setup completed"
      description: Complete 1Password CLI setup
