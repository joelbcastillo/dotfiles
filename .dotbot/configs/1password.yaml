- shell:
  - 
    command: |
      echo "Setting up 1Password CLI configuration..."
    description: Setting up 1Password CLI configuration

- shell:
  - 
    command: |
      # Create 1Password config directory if it doesn't exist
      mkdir -p ~/.config/op
    description: Create 1Password config directory

- link:
    ~/.config/op/config:
      path: tools/1password/config
      relink: true
      force: true
    description: Link 1Password CLI configuration

- shell:
  - 
    command: |
      echo "1Password CLI configuration setup completed"
    description: Complete 1Password CLI setup
