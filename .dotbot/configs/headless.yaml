# Headless profile — sysadmin bits for a clamshell-mode, tailnet-only Mac.
# Designed to compose on top of `default` (or `full`). This config only adds
# the headless-specific mechanics; it does NOT install machine-specific
# identity like hostname or authorized_keys (that belongs in the consuming
# repo, e.g. jbctechsolutions/jbc-dev-laptop).

- shell:
    - command: |
        # pmset settings for a Mac that must never idle-sleep on AC power.
        ~/.dotfiles/tools/macos/headless-power.sh
      description: Headless power config (pmset)
      stdin: true
      stderr: true

    - command: |
        # OpenSSH: enable Remote Login + install secure-defaults drop-in.
        # Per-host AllowUsers and authorized_keys are installed by the
        # consuming repo; this step just handles the global hardening.
        ~/.dotfiles/tools/ssh/enable-remote-login.sh
      description: OpenSSH hardening (secure defaults drop-in)
      stdin: true
      stderr: true

    - command: |
        # Screen Sharing LaunchDaemon — SSH-broken recovery path.
        ~/.dotfiles/tools/screensharing/enable.sh
      description: Enable Screen Sharing (VNC) for tailnet recovery
      stdin: true
      stderr: true

    - command: |
        # Tailscale: verify already installed and signed in; hostname rename
        # is the consuming repo's responsibility (needs the machine's ID).
        ~/.dotfiles/tools/tailscale/install.sh
      description: Verify Tailscale reachable
      stdin: true
      stderr: true
