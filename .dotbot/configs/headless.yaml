# Headless profile — sysadmin bits for a clamshell-mode, tailnet-only Mac.
# Designed to compose on top of `default` (or `full`). This config only adds
# the headless-specific mechanics; it does NOT install machine-specific
# identity like hostname or authorized_keys (that belongs in the consuming
# repo, e.g. jbctechsolutions/jbc-dev-laptop).

- shell:
    - command: |
        # pmset settings for a Mac that must never idle-sleep on AC power.
        ~/.dotfiles/tools/macos/headless-power.sh
      description: Headless power config (pmset)
      stdin: true
      stderr: true

    - command: |
        # OpenSSH: enable Remote Login + install secure-defaults drop-in.
        # Per-host AllowUsers and authorized_keys are installed by the
        # consuming repo; this step just handles the global hardening.
        ~/.dotfiles/tools/ssh/enable-remote-login.sh
      description: OpenSSH hardening (secure defaults drop-in)
      stdin: true
      stderr: true

    - command: |
        # Screen Sharing LaunchDaemon — SSH-broken recovery path.
        ~/.dotfiles/tools/screensharing/enable.sh
      description: Enable Screen Sharing (VNC) for tailnet recovery
      stdin: true
      stderr: true

    - command: |
        # Tailscale: verify installed + signed in, and align the node name.
        # install.sh defaults to the current $HOSTNAME / LocalHostName when
        # called with no args, so consuming repos that want a specific name
        # (e.g. jbc-dev-laptop's 20-set-hostname step) must set the machine's
        # hostname BEFORE this step runs.
        ~/.dotfiles/tools/tailscale/install.sh
      description: Verify Tailscale + align node hostname to local $HOSTNAME
      stdin: true
      stderr: true

    - command: |
        # 1Password service account token: interactive prompt if not yet set.
        # Writes ~/.config/op/token.sh (600), ensures ~/.zshrc sources it.
        # No-op when already configured or when stdin isn't a tty.
        ~/.dotfiles/tools/1password/service-account-install.sh
      description: 1Password service account token (interactive)
      stdin: true
      stdout: true
      stderr: true

    - command: |
        # Fetch ed25519 SSH key from 1Password to ~/.ssh/id_ed25519 and
        # pin it for github.com. Pre-req: an "SSH Key" item must exist in
        # the configured 1P vault (default: Local Dev / $(hostname -s)),
        # and its public key must be added to the user's GitHub account.
        # No-op when OP_SERVICE_ACCOUNT_TOKEN isn't set (e.g., on a laptop).
        ~/.dotfiles/tools/ssh/fetch-headless-ssh-key.sh
      description: Fetch headless SSH key from 1Password (no-op without SA token)
      stdin: true
      stderr: true

    - command: |
        # Configure git commit signing for this headless box: write
        # ~/.gitconfig.local pointing user.signingkey at the on-disk
        # pubkey from the previous step and gpg.ssh.program at system
        # ssh-keygen (not the laptop's op-ssh-sign). The public gitconfig
        # has an [include] for ~/.gitconfig.local at the bottom, so these
        # overrides win on this box and are no-op everywhere else.
        # Pubkey still needs registering on GitHub as a signing key —
        # see the script header for the gh API call.
        ~/.dotfiles/tools/git/headless-signing-config.sh
      description: Headless git commit-signing overrides (~/.gitconfig.local)
      stdin: true
      stderr: true
