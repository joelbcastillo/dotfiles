# NOTE: This config file is not actively used.
# Dotfiles are installed using profiles via: ./install profile <name>
# See .dotbot/profiles/ for available profiles (e.g., 'full', 'ai-tools')
#
# This file is kept as a minimal fallback/reference only.

- defaults:
    link:
      relink: true
      force: true
      create: true

- clean: ['~']

- shell:
    - [git submodule update --init --recursive, Installing git submodules]
    - [chmod +x ~/.dotfiles/scripts/*, Making scripts executable] 