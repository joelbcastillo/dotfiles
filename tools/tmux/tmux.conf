# ── General ──────────────────────────────────────────────────────────

# Modern terminal with true color and undercurl support
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\007'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -ga update-environment "TERM_PROGRAM"

# Prefix: C-a (screen-style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# No delay on escape (vi mode)
set -sg escape-time 0

# Bigger scrollback
set -g history-limit 50000

# Start window/pane indices at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Mouse support
set -g mouse on

# Clipboard and terminal passthrough (dmux / Cursor compatibility)
set -g set-clipboard on
set -g allow-passthrough all

# Pane and window styling (dmux — active pane obvious, borders show # and command)
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=default,bg=colour234'
set -g pane-border-style "fg=colour238 bg=default"
set -g pane-active-border-style "fg=blue bg=default"
set -g pane-border-format ' #[bold]#P #[default]#{?pane_title,#{pane_title},#{pane_current_command}} '
set -g pane-border-status top
set -g status-style 'bg=colour236'

# Focus events for vim/neovim autoread
set -g focus-events on

# Vi keys everywhere
set -g status-keys vi
set -g mode-keys vi

# Quiet — no bells
set -g bell-action none
set -g visual-bell off
set -g visual-activity off

# ── Key Bindings ────────────────────────────────────────────────────

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Detach (also works with ctrl held)
bind ^D detach-client

# ── Splits ──────────────────────────────────────────────────────────
# | and - are intuitive for direction; v and s are vim-style
# All preserve working directory
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ── Pane Navigation ────────────────────────────────────────────────
# Smart pane switching with awareness of vim splits
# Source: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Ctrl+Shift+Arrow pane navigation (dmux / no prefix)
bind -n C-S-Left select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up select-pane -U
bind -n C-S-Down select-pane -D

# ── Pane Resizing ──────────────────────────────────────────────────
# Shift + vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window Navigation ──────────────────────────────────────────────
# Quick window switching with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Previous/next window (repeatable)
bind -r p previous-window
bind -r n next-window

# Last window (double-tap prefix)
bind C-a last-window

# Swap windows left/right
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# ── Session Management ─────────────────────────────────────────────
# Session picker (since we took over 's' for splits)
bind S choose-tree -Zs

# ── Copy Mode ──────────────────────────────────────────────────────
# Enter copy mode with prefix + [
# v to begin selection, y to yank (like vim)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Mouse drag to copy to system clipboard (dmux)
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Synchronize Panes ──────────────────────────────────────────────
# Toggle sync (mnemonic: e for echo)
bind e setw synchronize-panes \; display "Sync #{?synchronize-panes,ON,OFF}"

# ── Plugins ─────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'fabioluciano/tmux-powerkit'

# tmux-powerkit configuration
# Theme: matte-black/default — near-monochrome dark with subtle accents.
# Status bar at the bottom (powerkit defaults to top); explicit so the
# preference doesn't drift if powerkit changes its default later.
#
# Favorites I've evaluated and want to keep handy. To try one live:
#   tmux set -g @powerkit_theme NAME \; \
#        set -g @powerkit_theme_variant VARIANT \; \
#        source-file ~/.tmux.conf
#
#   github       dark
#   onedark      dark
#   abyss        dark
#   ayu          dark      (also: light, mirage)
#   material     default   (also: lighter, ocean, palenight)
#   matte-black  default   ← current
#   slack        dark
#   starlight    dark
#   lagoon       dark
#   hackerman    default
#   nord         dark
set -g @powerkit_theme "matte-black"
set -g @powerkit_theme_variant "default"
set -g @powerkit_status_position "bottom"
set -g @powerkit_separator_style "angular"
set -g @powerkit_plugins "datetime,battery,cpu,memory,git"

# Initialize TPM (keep this at the end of plugin section)
run '~/.tmux/plugins/tpm/tpm'

# Local config (always last)
if-shell "[ -f ~/.tmux.conf.user ]" 'source ~/.tmux.conf.user'
