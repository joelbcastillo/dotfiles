run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
    - structcheck
    - varcheck
    - deadcode
    - ineffassign
    - typecheck
    - gocyclo
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true 