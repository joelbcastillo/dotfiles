# Secure defaults for OpenSSH on headless/tailnet-only macOS boxes.
# Installed by ~/.dotfiles/tools/ssh/enable-remote-login.sh into:
#   /etc/ssh/sshd_config.d/00-secure-defaults.conf
#
# Scope: applies to ALL users on the host. Per-host `AllowUsers` lives in a
# sibling drop-in (e.g. jbc-headless.conf) so each machine can own its own
# identity without editing this file.

# Key-only auth; no passwords.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# No root over SSH, ever.
PermitRootLogin no

# Tighten the auth loop.
MaxAuthTries 3
LoginGraceTime 30
PermitEmptyPasswords no

# Keep long-running SSH sessions (Claude Code, tmux) alive across flaky links.
ClientAliveInterval 60
ClientAliveCountMax 3

# Minor hygiene.
X11Forwarding no
AllowAgentForwarding yes
AllowTcpForwarding yes
GatewayPorts no
