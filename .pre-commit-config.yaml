repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '^apps/claude/patches/.*\.patch$'
      - id: mixed-line-ending
        exclude: '^apps/claude/patches/.*\.patch$'
      - id: trailing-whitespace
        # Patch context lines for blank source lines are a single space; stripping
        # them corrupts the diff and breaks `git apply`.
        exclude: '^apps/claude/patches/.*\.patch$'
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
      - id: forbid-tabs
        exclude: '(Makefile|\.gitmodules|\.git/)'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['-x', '--severity=warning']
        exclude: '^(shells/oh-my-zsh/custom/plugins/|\.dotbot/)'
