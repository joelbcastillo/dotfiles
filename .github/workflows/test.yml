name: Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          brew install shellcheck
          brew install zsh
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Run shell function tests
        run: /opt/homebrew/bin/zsh tests/run_tests.zsh

      - name: Run linting and validation tests
        run: /opt/homebrew/bin/zsh scripts/test.sh

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck zsh

      - name: Static checks (syntax + shellcheck, shared with scripts/test-static.sh)
        run: |
          chmod +x scripts/test-static.sh
          ./scripts/test-static.sh

  # End-to-end: non-root user + passwordless sudo, full bootstrap-linux.sh in Ubuntu 24.04
  test-linux-bootstrap:
    runs-on: ubuntu-latest
    needs: [ test-linux ]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run bootstrap in Docker
        run: |
          chmod +x scripts/test-linux-docker.sh
          ./scripts/test-linux-docker.sh
